<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5" style="max-width: 500px;">
        <h1 class="text-center mb-4">Личный кабинет</h1>
        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login"
                    type="button" role="tab">Вход</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register"
                    type="button" role="tab">Регистрация</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            <!-- Форма входа -->
            <div class="tab-pane fade show active" id="login" role="tabpanel">
                <form id="loginForm" class="card p-4 shadow-sm">
                    <div class="mb-3">
                        <label for="loginUsername" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="loginUsername" required>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
            </div>
            <!-- Форма регистрации -->
            <div class="tab-pane fade" id="register" role="tabpanel">
                <form id="registerForm" class="card p-4 shadow-sm">
                    <div class="mb-3">
                        <label for="regUsername" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="regUsername" required>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="regPassword" required>
                    </div>
                    <button type="submit" class="btn btn-success">Зарегистрироваться</button>
                </form>
            </div>
        </div>
        <div id="authMessage" class="mt-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Функция для отправки запросов
        async function authRequest(url, username, password) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.detail || 'Ошибка авторизации');
            }
            return data;
        }

        // Обработка входа
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const data = await authRequest('/auth/login', username, password);
                localStorage.setItem('access_token', data.access_token);
                window.location.href = '/dashboard.html';
            } catch (err) {
                document.getElementById('authMessage').innerHTML = `<div class="alert alert-danger">⚠️ ${err.message}</div>`;
            }
        });

        // Обработка регистрации
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            try {
                const data = await authRequest('/auth/register', username, password);
                localStorage.setItem('access_token', data.access_token);
                window.location.href = '/dashboard.html';
            } catch (err) {
                document.getElementById('authMessage').innerHTML = `<div class="alert alert-danger">⚠️ ${err.message}</div>`;
            }
        });
    </script>
    <script>
        // Если в URL есть hash, активируем нужную вкладку
        window.addEventListener('load', function () {
            if (window.location.hash === '#register') {
                const registerTab = document.getElementById('register-tab');
                const loginTab = document.getElementById('login-tab');
                if (registerTab && loginTab) {
                    // Переключаем вкладки
                    registerTab.classList.add('active');
                    loginTab.classList.remove('active');
                    document.getElementById('register').classList.add('show', 'active');
                    document.getElementById('login').classList.remove('show', 'active');
                }
            }
        });
    </script>
</body>

</html>
