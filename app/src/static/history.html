<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История операций</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Sentiment ML</a>
            <div class="ms-auto">
                <a href="/dashboard.html" class="btn btn-outline-light me-2">Кабинет</a>
                <button id="logoutBtn" class="btn btn-light">Выйти</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="mb-4">История операций</h1>

        <!-- Транзакции -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Транзакции</h5>
                <div id="transactionsContainer">
                    <div class="text-muted">Загрузка...</div>
                </div>
            </div>
        </div>

        <!-- Предсказания -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">ML-предсказания</h5>
                <div id="predictionsContainer">
                    <div class="text-muted">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/login.html';
        }

        async function apiRequest(url, method = 'GET') {
            const headers = {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            };
            const response = await fetch(url, { method, headers });
            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail || 'Ошибка запроса');
            }
            return response.json();
        }

        function formatDate(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString);
            return date.toLocaleString('ru-RU');
        }

        function renderTransactions(transactions) {
            const container = document.getElementById('transactionsContainer');
            if (!transactions.length) {
                container.innerHTML = '<div class="text-muted">История транзакций пуста.</div>';
                return;
            }
            const table = `
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Тип</th>
                            <th>Сумма</th>
                            <th>Задача</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${transactions.map(t => `
                            <tr>
                                <td>${formatDate(t.timestamp)}</td>
                                <td>${t.type === 'credit' ? 'Пополнение' : 'Списание'}</td>
                                <td>${t.amount}</td>
                                <td>${t.task_id || '-'}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
            container.innerHTML = table;
        }

        function renderPredictions(predictions) {
            const container = document.getElementById('predictionsContainer');
            if (!predictions.length) {
                container.innerHTML = '<div class="text-muted">История предсказаний пуста.</div>';
                return;
            }
            const table = `
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Модель</th>
                            <th>Текст</th>
                            <th>Статус</th>
                            <th>Результат</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${predictions.map(p => `
                            <tr>
                                <td>${formatDate(p.created_at)}</td>
                                <td>${p.model_name}</td>
                                <td>${p.input_data.length > 40 ? p.input_data.slice(0, 40) + '…' : p.input_data}</td>
                                <td>${p.status}</td>
                                <td>${p.label ? `${p.label} (${p.confidence})` : '-'}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
            container.innerHTML = table;
        }

        async function loadHistory() {
            try {
                const [transactions, predictions] = await Promise.all([
                    apiRequest('/history/transactions?limit=100'),
                    apiRequest('/history/predictions?limit=100')
                ]);
                renderTransactions(transactions);
                renderPredictions(predictions);
            } catch (err) {
                document.getElementById('transactionsContainer').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
                document.getElementById('predictionsContainer').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            window.location.href = '/login.html';
        });

        loadHistory();
    </script>
</body>

</html>
